<!DOCTYPE html>
<html>
    <head>
        <title>Flip cards</title>
        <style>
            h1{
                text-align: center;
                font-style: italic;
            }
            .maincontainer{
                position: relative;
                width: 280px;
                height: 360px;
                margin: auto;
                text-align: center;
            }
            .card{
                position:absolute;
                height: 100%;
                width: 100%;
                transform-style: preserve-3d;
                transition: all 0.5s ease;
            }
            .card:hover{
transform: rotateY(180deg);            }
            .front{
                position:absolute;
                width: 100%;
                height: 100%;
                border: 5px solid rgb(222, 0, 122) ;
                backface-visibility: hidden;
                background:black;
                /* color: rgb(222, 0, 122); */
                color: antiquewhite;
                text-align: center;
                border-radius: 15px 15px 15px 15px;
            }
            .container{
                text-align: center;
                height: auto;
            }
            img{
                border-radius: 15px 15px 0 0;
            }
            .back{
                position:absolute;
                width: 100%;
                height: 100%;
                border: 5px solid rgb(222, 0, 122);
                
                backface-visibility: hidden;
                background:black;
                color: rgb(222, 0, 122);
                transform: rotateY(180deg);
                text-align: center;
                border-radius: 15px 15px 15px 15px;
              font-family: Arial, Helvetica, sans-serif;
              
            }
        </style>
    </head>
    <body>
        <h1>Flip card</h1>
        <div class="maincontainer">
            <div class="card">
                <div class="front">
                    <img src="images/pink.jpg" height="290px" width="280px">
                    <div class="container"> 
                        <p style="font-size: 20px;">Lorem Ipsum</p>
                    </div>
                </div>
                <div class="back">
                    <div><h1>Back of card</h1></div>
                    <div><h2>Lorem Ipsum</h2></div>
                    <div><p style="padding-left: 10px; padding-right: 10px;">Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy text ever since the 1500s, when an unknown printer took a galley</p></div>
                    <div><p>It is a very tough task for me</p></div>
                </div>
            </div>
        </div>
    </body>
</html>
